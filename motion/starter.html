<!doctype html>
<html><head><meta charset="utf-8"><title>Motion film</title>
<link rel="stylesheet" href="{{MOTION}}/fonts/fonts.css">
<script src="{{MOTION}}/kit.js"></script>
<style>
/* Replace this palette with the chosen style-frame direction (docs/MOTION_GRAPHICS.md). */
:root{--a:#ff5a1f;--ink:#121212;--cream:#fff6ea}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--a);font-family:'Bricolage Grotesque',sans-serif;
  font-variation-settings:'opsz' 96;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.abs{position:absolute}.sc{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.x{font-weight:800;letter-spacing:-.055em;line-height:.8;white-space:nowrap}
.grain{position:absolute;inset:0;pointer-events:none;z-index:90;opacity:.10;mix-blend-mode:overlay;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' seed='9'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style></head><body><div id="stage">
  <!-- One idea per scene. Scene ids and times live in SC below; music and SFX cues are timed to them. -->
  <section class="sc" id="s1" style="background:var(--a)"><div class="abs x" id="h1" style="left:90px;top:300px;font-size:240px;color:var(--ink)">Hook.</div></section>
  <section class="sc" id="s2" style="background:var(--ink)"><div class="abs x" id="h2" style="left:90px;top:300px;font-size:240px;color:var(--cream)">Turn.</div></section>
  <section class="sc" id="s3" style="background:var(--cream)"><div class="abs x" id="h3" style="left:90px;top:300px;font-size:240px;color:var(--ink)">Payoff.</div></section>
  <div class="grain"></div>
  <div class="abs" id="black" style="inset:0;background:#000;opacity:0;z-index:95"></div>
</div>
<script>
const {$,cl,P,L,eo,eio,S,pop,glide,sceneWipes}=MK;
const SC=[['s1',0,3],['s2',3,6],['s3',6,9]];
window.DUR=9;
function seek(t){
  sceneWipes(t,SC,{s2:[1,0],s3:[0,1]});
  pop('h1',t,.3,{from:.3});pop('h2',t-3,.4,{from:1.35});pop('h3',t-6,.4,{from:.3,dy:80});
  $('black').style.opacity=P(t,DUR-.6,DUR);
}
window.seek=seek;seek(0);
</script></body></html>
